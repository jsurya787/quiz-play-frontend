<main class="min-h-screen bg-slate-50 px-4 py-12 text-slate-900 sm:px-6">
  <section class="mx-auto max-w-2xl pt-8">
    <h1 class="text-2xl font-bold">Microsoft authentication test</h1>
    <p class="mt-2 text-sm text-slate-600">
      Sign in and request your profile from the test API.
    </p>

    <button
      type="button"
      class="mt-6 inline-flex min-h-11 items-center justify-center gap-3 rounded-lg border border-slate-300 bg-white px-5 py-2.5 font-semibold text-slate-800 shadow-sm transition hover:bg-slate-100 disabled:cursor-wait disabled:opacity-60"
      [disabled]="status() === 'loading'"
      (click)="signIn()">
      <span class="grid h-4 w-4 grid-cols-2 gap-0.5" aria-hidden="true">
        <span class="bg-[#f25022]"></span><span class="bg-[#7fba00]"></span>
        <span class="bg-[#00a4ef]"></span><span class="bg-[#ffb900]"></span>
      </span>
      {{ status() === 'loading' ? 'Signing in and loading profile...' : 'Sign in with Microsoft' }}
    </button>

    @if (status() === 'loading') {
      <p class="mt-5 text-sm text-slate-600" role="status">Waiting for Microsoft and the profile API...</p>
    }

    @if (status() === 'success') {
      <section class="mt-6 rounded-lg border border-emerald-200 bg-white p-5" aria-live="polite">
        <h2 class="font-semibold text-emerald-800">Profile request succeeded</h2>
        <pre class="mt-3 overflow-x-auto whitespace-pre-wrap break-words rounded bg-slate-50 p-4 text-sm">{{ profile() | json }}</pre>
      </section>
    }

    @if (status() === 'error') {
      <div class="mt-6 rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-800" role="alert">
        {{ errorMessage() }}
      </div>
    }
  </section>
</main>
