<div class="profile-shell relative w-[92vw] sm:w-[440px] max-w-lg max-h-[85vh] flex flex-col rounded-[28px] sm:rounded-[36px] bg-white/80 backdrop-blur-3xl shadow-[0_40px_100px_rgba(0,0,0,0.25)] border border-white/60 overflow-hidden animate-profile-pop">
  <div class="absolute top-0 left-0 w-full h-24 sm:h-28 bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 opacity-90"></div>
  <div class="absolute top-16 left-8 w-24 h-24 bg-indigo-400/20 blur-[50px] rounded-full animate-float-slow"></div>
  <div class="absolute top-8 right-8 w-20 h-20 bg-purple-400/20 blur-[40px] rounded-full animate-float-slow-reverse"></div>

  <button
    (click)="close.emit()"
    class="absolute top-4 right-4 sm:top-4 sm:right-4 w-8 h-8 sm:w-8 sm:h-8 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center transition-all duration-300 z-50 backdrop-blur-md border border-white/30 active:scale-90"
    aria-label="Close profile">
    <svg class="w-4 h-4 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>

  <div class="relative px-5 sm:px-6 pb-5 sm:pb-6 pt-8 sm:pt-10 text-center overflow-y-auto flex-1 hide-scrollbar">
    <div class="relative mx-auto w-20 h-20 sm:w-24 sm:h-24 mb-4 sm:mb-5 group mt-0">
      <div class="absolute -inset-1.5 rounded-full bg-gradient-to-r from-indigo-500 via-purple-500 to-fuchsia-500 opacity-70 blur-md transition duration-500 group-hover:opacity-100 animate-spin-slow"></div>

      <div class="relative w-full h-full rounded-full bg-white p-1 shadow-xl">
        <div class="w-full h-full rounded-full bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center text-3xl sm:text-4xl overflow-hidden relative border border-slate-200/50">
          @if (user()?.photoURL) {
            <img [src]="user()?.photoURL" class="w-full h-full object-cover" alt="User avatar">
          } @else {
            <span class="font-black text-slate-300 select-none">
              {{ user()?.firstName?.charAt(0) || 'U' }}
            </span>
          }
        </div>
      </div>

      <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 px-2.5 sm:px-3 py-0.5 sm:py-1 bg-gray-900 text-white text-[9px] sm:text-[10px] font-black uppercase tracking-[0.15em] rounded-full border-2 border-white shadow-2xl z-10 whitespace-nowrap">
        {{ rank() }}
      </div>
    </div>

    <div class="space-y-1 mb-5 sm:mb-6">
      <h3 class="text-xl sm:text-2xl font-black text-gray-900 tracking-tight leading-tight">
        {{ user()?.displayName || (user()?.firstName + ' ' + user()?.lastName) || 'Quiz Maestro' }}
      </h3>
      <p class="text-[10px] sm:text-[11px] font-bold text-gray-400 uppercase tracking-widest">{{ user()?.email }}</p>

      <div class="mt-2 sm:mt-3 inline-flex items-center gap-1.5 px-3 py-1 sm:py-1.5 rounded-full bg-indigo-50/50 border border-indigo-100/50 backdrop-blur-sm">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
        <span class="text-[9px] sm:text-[10px] font-black text-indigo-600 uppercase tracking-[0.2em] italic">{{ roleLabel() }}</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-5 sm:mb-6">
      <button
        type="button"
        (click)="openMe('created')"
        class="relative p-3 sm:p-4 rounded-[20px] sm:rounded-[24px] bg-gradient-to-br from-indigo-50/50 to-white border border-indigo-100/50 group overflow-hidden transition-all duration-300 hover:shadow-xl hover:shadow-indigo-500/5 hover:-translate-y-1 text-left w-full"
      >
        <div class="absolute top-0 right-0 p-1.5 bg-indigo-500/5 rounded-bl-2xl">⚡</div>
        <p class="text-[9px] sm:text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-0.5 text-left">Pool</p>
        <p class="text-xl sm:text-2xl font-black text-gray-900 text-left">{{ totalQuizes() }}</p>
        <p class="text-[9px] text-indigo-400 font-bold uppercase mt-0.5 text-left">Total Quiz</p>
      </button>

      <button
        type="button"
        (click)="openMe('attempted')"
        class="relative p-3 sm:p-4 rounded-[20px] sm:rounded-[24px] bg-gradient-to-br from-purple-50/50 to-white border border-purple-100/50 group overflow-hidden transition-all duration-300 hover:shadow-xl hover:shadow-purple-500/5 hover:-translate-y-1 text-left w-full"
      >
        <div class="absolute top-0 right-0 p-1.5 bg-purple-500/5 rounded-bl-2xl">🎯</div>
        <p class="text-[9px] sm:text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-0.5 text-left">XP</p>
        <p class="text-xl sm:text-2xl font-black text-gray-900 text-left">{{ attemptedQuizes() }}</p>
        <p class="text-[9px] text-purple-400 font-bold uppercase mt-0.5 text-left">Attempts</p>
      </button>
    </div>

    <div class="grid grid-cols-1 gap-2 sm:gap-2.5">
      <button
        (click)="openMe()"
        class="premium-edit-btn group w-full py-2.5 sm:py-3 rounded-xl sm:rounded-2xl font-black uppercase tracking-tighter text-[11px] sm:text-xs transition-all duration-300 active:scale-95 flex items-center justify-center gap-2">
        <span class="text-base sm:text-lg">✏️</span>
        Edit Profile
      </button>

      <button
        (click)="changePassword()"
        class="premium-access-btn group w-full py-2.5 sm:py-3 rounded-xl sm:rounded-2xl font-black uppercase tracking-tighter text-[11px] sm:text-xs transition-all duration-300 active:scale-95 flex items-center justify-center gap-2 bg-slate-900 text-white border border-slate-700 hover:bg-slate-800 hover:shadow-lg">
        <span class="text-base sm:text-lg group-hover:rotate-12 transition-transform">🔑</span>
        Change Access
      </button>

      <button
        (click)="logout()"
        class="w-full py-2.5 sm:py-3 rounded-xl sm:rounded-2xl bg-red-50 text-red-600 font-black uppercase tracking-tighter text-[11px] sm:text-xs transition-all duration-300 hover:bg-red-100 hover:shadow-lg shadow-red-100/50 active:scale-95 flex items-center justify-center gap-2">
        <span class="text-base sm:text-lg">🚪</span>
        Depart Now
      </button>
    </div>
  </div>

  <div class="py-2.5 sm:py-3 bg-gray-50/50 border-t border-black/[0.02] flex items-center justify-center gap-1.5 shrink-0 mt-auto">
    <div class="w-4 h-4 rounded-md sm:rounded-lg bg-indigo-600 flex items-center justify-center text-[9px] text-white font-black italic">QP</div>
    <span class="text-[9px] sm:text-[10px] font-bold text-gray-400 uppercase tracking-[0.3em]">QuizPlay Alpha</span>
  </div>
</div>
