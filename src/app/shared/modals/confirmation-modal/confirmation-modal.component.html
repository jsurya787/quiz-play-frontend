@if (isOpen) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-0">
    <!-- Backdrop -->
    <div 
      class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity"
      (click)="onCancel()"
    ></div>

    <!-- Modal Panel -->
    <div 
      class="relative bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all scale-100"
    >
      <div class="p-6 text-center">
        <!-- Icon -->
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-6"
          [class.bg-red-100]="type === 'danger'"
          [class.text-red-600]="type === 'danger'"
          [class.bg-amber-100]="type === 'warning'"
          [class.text-amber-600]="type === 'warning'"
          [class.bg-blue-100]="type === 'info'"
          [class.text-blue-600]="type === 'info'"
          [class.bg-emerald-100]="type === 'success'"
          [class.text-emerald-600]="type === 'success'"
        >
          @if (type === 'danger') {
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          } @else if (type === 'warning') {
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          } @else if (type === 'success') {
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          } @else {
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          }
        </div>

        <!-- Content -->
        <h3 class="text-xl font-bold text-slate-900 mb-2">{{title}}</h3>
        <p class="text-sm text-slate-500 mb-8 px-4">{{message}}</p>

        <!-- Actions -->
        <div class="grid grid-cols-2 gap-3">
          <button 
            (click)="onCancel()"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-600 font-bold hover:bg-slate-50 hover:text-slate-900 transition-colors"
          >
            {{cancelText}}
          </button>
          <button 
            (click)="onConfirm()"
            class="w-full px-4 py-3 rounded-xl text-white font-bold shadow-lg shadow-current/20 hover:shadow-xl hover:scale-[1.02] transition-all"
            [class.bg-red-600]="type === 'danger'"
            [class.bg-amber-600]="type === 'warning'"
            [class.bg-blue-600]="type === 'info'"
            [class.bg-emerald-600]="type === 'success'"
          >
            {{confirmText}}
          </button>
        </div>
      </div>
    </div>
  </div>
}
